<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540"
     font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0d1117"/>
    <stop offset="100%" style="stop-color:#161b22"/>
  </linearGradient>
  <linearGradient id="sgG" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" style="stop-color:#1a2744"/>
    <stop offset="100%" style="stop-color:#0f1d38"/>
  </linearGradient>
  <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/></filter>
  <marker id="mB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
  <marker id="mG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#3fb950"/></marker>
  <marker id="mO" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#e3b341"/></marker>
  <marker id="mR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f85149"/></marker>
</defs>
<rect width="960" height="540" fill="url(#bgG)"/>
<text x="480" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#c9d1d9">SchemaGuard - System Architecture</text>
<text x="480" y="56" text-anchor="middle" font-size="11" fill="#8b949e">LLM-generated structured data validation pipeline</text>
<line x1="80" y1="68" x2="880" y2="68" stroke="#30363d" stroke-width="1"/>
<!-- LLM box -->
<rect x="40" y="105" width="145" height="90" rx="10" fill="#1c2a3a" stroke="#30363d" stroke-width="1.5" filter="url(#sh)"/>
<text x="112" y="146" text-anchor="middle" font-size="20" fill="#8b949e">&#x1F916;</text>
<text x="112" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#c9d1d9">LLM API</text>
<text x="112" y="181" text-anchor="middle" font-size="10" fill="#8b949e">GPT-4 / Claude / Llama</text>
<line x1="185" y1="150" x2="228" y2="150" stroke="#58a6ff" stroke-width="2" marker-end="url(#mB)"/>
<text x="206" y="143" text-anchor="middle" font-size="9" fill="#8b949e">JSON</text>
<!-- Input Record -->
<rect x="230" y="105" width="145" height="90" rx="10" fill="#1c2129" stroke="#30363d" stroke-width="1.5" filter="url(#sh)"/>
<text x="302" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#c9d1d9">Input Record</text>
<text x="302" y="152" text-anchor="middle" font-size="9" fill="#8b949e" font-family="monospace">patient_id, admission,</text>
<text x="302" y="166" text-anchor="middle" font-size="9" fill="#8b949e" font-family="monospace">discharge, loan_amount</text>
<text x="302" y="183" text-anchor="middle" font-size="9" fill="rgba(88,166,255,0.6)">schema-valid JSON</text>
<line x1="375" y1="150" x2="418" y2="150" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#mB)"/>
<!-- SchemaGuard Core -->
<rect x="420" y="80" width="320" height="380" rx="14" fill="url(#sgG)" stroke="rgba(88,166,255,0.35)" stroke-width="2" filter="url(#sh)"/>
<text x="580" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#58a6ff">SchemaGuard</text>
<text x="580" y="120" text-anchor="middle" font-size="10" fill="rgba(88,166,255,0.65)">Semantic Validation Engine</text>
<!-- Stages -->
<rect x="445" y="132" width="270" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="445" y="132" width="5" height="52" rx="2" fill="#da3633"/>
<text x="588" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#c9d1d9">Stage 1 - Structural Validation</text>
<text x="588" y="170" text-anchor="middle" font-size="9.5" fill="#8b949e">JSON Schema Draft 7 - types, formats, required fields</text>
<rect x="445" y="196" width="270" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="445" y="196" width="5" height="52" rx="2" fill="#da3633"/>
<text x="588" y="217" text-anchor="middle" font-size="11" font-weight="700" fill="#c9d1d9">Stage 2 - Semantic Rules</text>
<text x="588" y="234" text-anchor="middle" font-size="9.5" fill="#8b949e">10 cross-field rules - temporal, ratio, plausibility</text>
<rect x="445" y="260" width="270" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="445" y="260" width="5" height="52" rx="2" fill="#58a6ff"/>
<text x="588" y="281" text-anchor="middle" font-size="11" font-weight="700" fill="#c9d1d9">Stage 3 - Confidence Scoring</text>
<text x="588" y="298" text-anchor="middle" font-size="9.5" fill="#8b949e">score = 1.0 - 0.30*critical - 0.12*warning</text>
<rect x="445" y="324" width="270" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="445" y="324" width="5" height="52" rx="2" fill="#8b949e"/>
<text x="588" y="345" text-anchor="middle" font-size="11" font-weight="700" fill="#c9d1d9">Stage 4 - Decision Router</text>
<text x="588" y="362" text-anchor="middle" font-size="9.5" fill="#8b949e">trusted >=0.85 / flagged 0.50-0.84 / quarantined &lt;0.50</text>
<!-- Stage connectors -->
<line x1="580" y1="184" x2="580" y2="196" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3,2"/>
<line x1="580" y1="248" x2="580" y2="260" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3,2"/>
<line x1="580" y1="312" x2="580" y2="324" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3,2"/>
<!-- RAG + Audit -->
<rect x="445" y="390" width="125" height="44" rx="7" fill="#0d1117" stroke="rgba(88,166,255,0.25)" stroke-width="1"/>
<text x="508" y="408" text-anchor="middle" font-size="10" font-weight="700" fill="#58a6ff">RAG Explainer</text>
<text x="508" y="424" text-anchor="middle" font-size="9" fill="#8b949e">regulatory context</text>
<rect x="590" y="390" width="125" height="44" rx="7" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="652" y="408" text-anchor="middle" font-size="10" font-weight="700" fill="#8b949e">Audit Log</text>
<text x="652" y="424" text-anchor="middle" font-size="9" fill="#8b949e">JSONL - full trace</text>
<line x1="580" y1="376" x2="508" y2="390" stroke="#30363d" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="580" y1="376" x2="652" y2="390" stroke="#30363d" stroke-width="1" stroke-dasharray="3,2"/>
<!-- Output boxes -->
<rect x="775" y="92" width="148" height="60" rx="9" fill="rgba(35,134,54,0.12)" stroke="rgba(35,134,54,0.4)" stroke-width="1.5" filter="url(#sh)"/>
<text x="849" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#3fb950">TRUSTED</text>
<text x="849" y="133" text-anchor="middle" font-size="9.5" fill="rgba(63,185,80,0.7)">score >= 0.85</text>
<text x="849" y="146" text-anchor="middle" font-size="9" fill="#8b949e">downstream DB</text>
<rect x="775" y="170" width="148" height="60" rx="9" fill="rgba(210,153,34,0.12)" stroke="rgba(210,153,34,0.4)" stroke-width="1.5" filter="url(#sh)"/>
<text x="849" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#e3b341">FLAGGED</text>
<text x="849" y="211" text-anchor="middle" font-size="9.5" fill="rgba(227,179,65,0.7)">score 0.50-0.84</text>
<text x="849" y="224" text-anchor="middle" font-size="9" fill="#8b949e">human review queue</text>
<rect x="775" y="248" width="148" height="60" rx="9" fill="rgba(218,54,51,0.12)" stroke="rgba(218,54,51,0.4)" stroke-width="1.5" filter="url(#sh)"/>
<text x="849" y="273" text-anchor="middle" font-size="12" font-weight="700" fill="#f85149">QUARANTINED</text>
<text x="849" y="289" text-anchor="middle" font-size="9.5" fill="rgba(248,81,73,0.7)">score &lt; 0.50</text>
<text x="849" y="302" text-anchor="middle" font-size="9" fill="#8b949e">blocked + alerted</text>
<rect x="775" y="326" width="148" height="60" rx="9" fill="rgba(88,166,255,0.07)" stroke="rgba(88,166,255,0.25)" stroke-width="1.5" filter="url(#sh)"/>
<text x="849" y="350" text-anchor="middle" font-size="11" font-weight="700" fill="#58a6ff">Drift Alert</text>
<text x="849" y="366" text-anchor="middle" font-size="9.5" fill="rgba(88,166,255,0.7)">PSI / z-score / nulls</text>
<text x="849" y="379" text-anchor="middle" font-size="9" fill="#8b949e">ops notification</text>
<!-- Output arrows -->
<line x1="740" y1="356" x2="740" y2="122" stroke="#30363d" stroke-width="1.2"/>
<line x1="740" y1="122" x2="773" y2="122" stroke="#3fb950" stroke-width="1.8" marker-end="url(#mG)"/>
<line x1="740" y1="200" x2="773" y2="200" stroke="#e3b341" stroke-width="1.8" marker-end="url(#mO)"/>
<line x1="740" y1="278" x2="773" y2="278" stroke="#f85149" stroke-width="1.8" marker-end="url(#mR)"/>
<line x1="740" y1="356" x2="773" y2="356" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#mB)"/>
<!-- Stats footer -->
<rect x="40" y="470" width="880" height="50" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
<text x="480" y="490" text-anchor="middle" font-size="10" font-weight="600" fill="#8b949e">SYSTEM METRICS</text>
<text x="160" y="508" text-anchor="middle" font-size="11" font-weight="700" fill="#58a6ff">0.09 ms</text>
<text x="160" y="520" text-anchor="middle" font-size="9" fill="#8b949e">median latency</text>
<text x="310" y="508" text-anchor="middle" font-size="11" font-weight="700" fill="#58a6ff">~3,800 rec/s</text>
<text x="310" y="520" text-anchor="middle" font-size="9" fill="#8b949e">throughput</text>
<text x="460" y="508" text-anchor="middle" font-size="11" font-weight="700" fill="#3fb950">0%</text>
<text x="460" y="520" text-anchor="middle" font-size="9" fill="#8b949e">false quarantine rate</text>
<text x="620" y="508" text-anchor="middle" font-size="11" font-weight="700" fill="#58a6ff">10 rules / 2 domains</text>
<text x="620" y="520" text-anchor="middle" font-size="9" fill="#8b949e">healthcare + finance</text>
<text x="780" y="508" text-anchor="middle" font-size="11" font-weight="700" fill="#58a6ff">53/53</text>
<text x="780" y="520" text-anchor="middle" font-size="9" fill="#8b949e">adversarial tests passed</text>
<line x1="235" y1="477" x2="235" y2="512" stroke="#21262d" stroke-width="1"/>
<line x1="385" y1="477" x2="385" y2="512" stroke="#21262d" stroke-width="1"/>
<line x1="535" y1="477" x2="535" y2="512" stroke="#21262d" stroke-width="1"/>
<line x1="695" y1="477" x2="695" y2="512" stroke="#21262d" stroke-width="1"/>
</svg>