<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580"
     font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0d1117"/>
    <stop offset="100%" style="stop-color:#161b22"/>
  </linearGradient>
  <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/></filter>
  <marker id="mB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#58a6ff"/></marker>
</defs>
<rect width="960" height="580" fill="url(#bgG)"/>
<text x="480" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#c9d1d9">Before vs After: SchemaGuard Validation</text>
<text x="480" y="55" text-anchor="middle" font-size="11" fill="#8b949e">Silent semantic failures caught before reaching downstream systems</text>
<line x1="80" y1="67" x2="880" y2="67" stroke="#30363d" stroke-width="1"/>
<!-- Row 1 labels -->
<rect x="40" y="82" width="420" height="24" rx="5" fill="rgba(218,54,51,0.12)" stroke="rgba(218,54,51,0.3)" stroke-width="1"/>
<text x="250" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#f85149">BEFORE - Raw LLM output passes JSON Schema</text>
<rect x="500" y="82" width="420" height="24" rx="5" fill="rgba(35,134,54,0.12)" stroke="rgba(35,134,54,0.3)" stroke-width="1"/>
<text x="710" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#3fb950">AFTER - SchemaGuard catches the violation</text>
<!-- HC-003 BEFORE -->
<rect x="40" y="114" width="420" height="140" rx="9" fill="#161b22" stroke="rgba(218,54,51,0.3)" stroke-width="1.5" filter="url(#sh)"/>
<text x="60" y="133" font-size="10" font-weight="600" fill="#8b949e">Healthcare HC-003: discharge before admission</text>
<line x1="50" y1="140" x2="450" y2="140" stroke="#21262d" stroke-width="1"/>
<text x="60" y="158" font-size="10" fill="#8b949e" font-family="monospace">{</text>
<text x="70" y="172" font-size="10" fill="#3fb950" font-family="monospace">"patient_id": "P-4412",</text>
<text x="70" y="186" font-size="10" fill="#3fb950" font-family="monospace">"admission_date": "2024-08-15",</text>
<text x="70" y="200" font-size="10" fill="#f85149" font-family="monospace">"discharge_date": "2024-08-08",</text>
<text x="70" y="214" font-size="10" fill="#3fb950" font-family="monospace">"patient_age": 34, "diagnosis_code": "N39.0"</text>
<text x="60" y="228" font-size="10" fill="#8b949e" font-family="monospace">}</text>
<text x="250" y="247" text-anchor="middle" font-size="10" fill="rgba(218,54,51,0.7)">JSON Schema: VALID - Downstream: corrupted record</text>
<line x1="462" y1="184" x2="497" y2="184" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#mB)"/>
<text x="479" y="177" text-anchor="middle" font-size="10" font-weight="700" fill="#58a6ff">SG</text>
<!-- HC-003 AFTER -->
<rect x="500" y="114" width="420" height="140" rx="9" fill="#161b22" stroke="rgba(35,134,54,0.35)" stroke-width="1.5" filter="url(#sh)"/>
<text x="520" y="133" font-size="10" font-weight="600" fill="#8b949e">SchemaGuard result</text>
<line x1="510" y1="140" x2="910" y2="140" stroke="#21262d" stroke-width="1"/>
<rect x="520" y="148" width="100" height="24" rx="5" fill="rgba(210,153,34,0.15)" stroke="rgba(210,153,34,0.4)" stroke-width="1"/>
<text x="570" y="163" text-anchor="middle" font-size="11" font-weight="700" fill="#e3b341">FLAGGED</text>
<text x="640" y="163" font-size="10" fill="#8b949e">confidence: <tspan fill="#e3b341" font-weight="600">0.70</tspan></text>
<line x1="510" y1="178" x2="910" y2="178" stroke="#21262d" stroke-width="1" stroke-dasharray="3,2"/>
<text x="520" y="194" font-size="9.5" fill="#f85149" font-weight="600">Rule HC-003 violated - severity: CRITICAL</text>
<text x="520" y="210" font-size="9.5" fill="#8b949e">Discharge (2024-08-08) precedes admission (2024-08-15)</text>
<text x="520" y="226" font-size="9.5" fill="rgba(88,166,255,0.8)">Regulatory: NUBC UB-04 FL6/FL16 - negative LOS invalid</text>
<text x="520" y="242" font-size="9.5" fill="rgba(63,185,80,0.8)">Fix: swap dates or verify source document</text>
<text x="710" y="250" text-anchor="middle" font-size="10" fill="rgba(35,134,54,0.7)">Routed to human review queue - Downstream: protected</text>
<!-- Row 2 divider -->
<line x1="40" y1="267" x2="920" y2="267" stroke="#21262d" stroke-width="1"/>
<!-- FN-002 BEFORE -->
<rect x="40" y="280" width="420" height="140" rx="9" fill="#161b22" stroke="rgba(218,54,51,0.3)" stroke-width="1.5" filter="url(#sh)"/>
<text x="60" y="299" font-size="10" font-weight="600" fill="#8b949e">Finance FN-002: extreme loan-to-income ratio</text>
<line x1="50" y1="306" x2="450" y2="306" stroke="#21262d" stroke-width="1"/>
<text x="60" y="324" font-size="10" fill="#8b949e" font-family="monospace">{</text>
<text x="70" y="338" font-size="10" fill="#3fb950" font-family="monospace">"application_id": "LA-33190",</text>
<text x="70" y="352" font-size="10" fill="#f85149" font-family="monospace">"annual_income": 48000,</text>
<text x="70" y="366" font-size="10" fill="#f85149" font-family="monospace">"loan_amount": 2500000,</text>
<text x="70" y="380" font-size="10" fill="#3fb950" font-family="monospace">"credit_score": 680</text>
<text x="60" y="394" font-size="10" fill="#8b949e" font-family="monospace">}</text>
<text x="250" y="413" text-anchor="middle" font-size="10" fill="rgba(218,54,51,0.7)">JSON Schema: VALID - LTI = 52.1x - QM violation</text>
<line x1="462" y1="350" x2="497" y2="350" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#mB)"/>
<text x="479" y="343" text-anchor="middle" font-size="10" font-weight="700" fill="#58a6ff">SG</text>
<!-- FN-002 AFTER -->
<rect x="500" y="280" width="420" height="140" rx="9" fill="#161b22" stroke="rgba(35,134,54,0.35)" stroke-width="1.5" filter="url(#sh)"/>
<text x="520" y="299" font-size="10" font-weight="600" fill="#8b949e">SchemaGuard result</text>
<line x1="510" y1="306" x2="910" y2="306" stroke="#21262d" stroke-width="1"/>
<rect x="520" y="314" width="100" height="24" rx="5" fill="rgba(210,153,34,0.15)" stroke="rgba(210,153,34,0.4)" stroke-width="1"/>
<text x="570" y="329" text-anchor="middle" font-size="11" font-weight="700" fill="#e3b341">FLAGGED</text>
<text x="640" y="329" font-size="10" fill="#8b949e">confidence: <tspan fill="#e3b341" font-weight="600">0.70</tspan></text>
<line x1="510" y1="344" x2="910" y2="344" stroke="#21262d" stroke-width="1" stroke-dasharray="3,2"/>
<text x="520" y="360" font-size="9.5" fill="#f85149" font-weight="600">Rule FN-002 violated - severity: CRITICAL</text>
<text x="520" y="376" font-size="9.5" fill="#8b949e">Loan ($2,500,000) = 52.1x income ($48,000). Max: 10x</text>
<text x="520" y="392" font-size="9.5" fill="rgba(88,166,255,0.8)">Regulatory: CFPB ATR Rule, 12 CFR 1026.43(c)</text>
<text x="520" y="408" font-size="9.5" fill="rgba(63,185,80,0.8)">Auto-fix: reduce loan_amount to 480,000</text>
<text x="710" y="416" text-anchor="middle" font-size="10" fill="rgba(35,134,54,0.7)">Routed to human review queue - ATR violation prevented</text>
<!-- Summary bar -->
<rect x="40" y="435" width="880" height="72" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
<text x="480" y="456" text-anchor="middle" font-size="10" font-weight="600" fill="#8b949e">WHAT JSON SCHEMA MISSES - WHAT SCHEMAGUARD CATCHES</text>
<line x1="60" y1="462" x2="900" y2="462" stroke="#21262d" stroke-width="1"/>
<text x="120" y="477" text-anchor="middle" font-size="11" fill="#f85149">JSON Schema</text>
<text x="120" y="492" text-anchor="middle" font-size="9" fill="#8b949e">structural only</text>
<line x1="228" y1="465" x2="228" y2="500" stroke="#21262d" stroke-width="1"/>
<text x="335" y="477" text-anchor="middle" font-size="11" fill="#3fb950">SchemaGuard</text>
<text x="335" y="492" text-anchor="middle" font-size="9" fill="#8b949e">structural + semantic</text>
<line x1="450" y1="465" x2="450" y2="500" stroke="#21262d" stroke-width="1"/>
<text x="570" y="477" text-anchor="middle" font-size="10" fill="#8b949e">Temporal violations</text>
<text x="570" y="492" text-anchor="middle" font-size="9.5" fill="#3fb950">caught: HC-002, HC-003, FN-001</text>
<line x1="680" y1="465" x2="680" y2="500" stroke="#21262d" stroke-width="1"/>
<text x="800" y="477" text-anchor="middle" font-size="10" fill="#8b949e">Ratio violations</text>
<text x="800" y="492" text-anchor="middle" font-size="9.5" fill="#3fb950">caught: FN-002, FN-003, FN-004, FN-005</text>
<text x="480" y="530" text-anchor="middle" font-size="9.5" fill="#8b949e">Both records are type-correct, schema-valid JSON. Neither raises a JSON Schema error.</text>
<text x="480" y="548" text-anchor="middle" font-size="9.5" fill="rgba(88,166,255,0.6)">SchemaGuard intercepts both before they reach downstream databases, billing systems, or credit risk models.</text>
</svg>